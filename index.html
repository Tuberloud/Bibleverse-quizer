<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESV Bible Verse Memorization Quiz</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        select, input, textarea, button {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .checkbox-group input {
            width: auto;
        }

        #quiz-container {
            margin-top: 20px;
            line-height: 2.2;
            font-size: 1.15rem;
        }

        .blank-input {
            display: inline-block;
            width: 110px;
            padding: 2px 6px;
            margin: 0 4px;
            border: 2px solid var(--primary-color);
            border-radius: 4px;
            font-size: 1rem;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .correct {
            color: #16a34a;
            background-color: #dcfce7;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .incorrect {
            color: #dc2626;
            background-color: #fee2e2;
            text-decoration: line-through;
            padding: 2px 4px;
            border-radius: 4px;
            margin-right: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ESV Bible Verse Memorizer</h1>

    <!-- Setup Form -->
    <div id="setup-section">
        
        <!-- Toggle for Paste Mode -->
        <div class="checkbox-group">
            <input type="checkbox" id="paste-toggle">
            <label for="paste-toggle" style="margin-bottom:0; cursor:pointer;">Paste verse text manually instead of using API</label>
        </div>

        <!-- API Selector Section -->
        <div id="api-inputs">
            <div class="form-group">
                <label for="book-select">Select Bible Book</label>
                <select id="book-select">
                    <!-- Old Testament -->
                    <optgroup label="Old Testament">
                        <option value="Genesis">Genesis</option>
                        <option value="Exodus">Exodus</option>
                        <option value="Leviticus">Leviticus</option>
                        <option value="Numbers">Numbers</option>
                        <option value="Deuteronomy">Deuteronomy</option>
                        <option value="Joshua">Joshua</option>
                        <option value="Judges">Judges</option>
                        <option value="Ruth">Ruth</option>
                        <option value="1 Samuel">1 Samuel</option>
                        <option value="2 Samuel">2 Samuel</option>
                        <option value="1 Kings">1 Kings</option>
                        <option value="2 Kings">2 Kings</option>
                        <option value="1 Chronicles">1 Chronicles</option>
                        <option value="2 Chronicles">2 Chronicles</option>
                        <option value="Ezra">Ezra</option>
                        <option value="Nehemiah">Nehemiah</option>
                        <option value="Esther">Esther</option>
                        <option value="Job">Job</option>
                        <option value="Psalms">Psalms</option>
                        <option value="Proverbs">Proverbs</option>
                        <option value="Ecclesiastes">Ecclesiastes</option>
                        <option value="Song of Solomon">Song of Solomon</option>
                        <option value="Isaiah">Isaiah</option>
                        <option value="Jeremiah">Jeremiah</option>
                        <option value="Lamentations">Lamentations</option>
                        <option value="Ezekiel">Ezekiel</option>
                        <option value="Daniel">Daniel</option>
                        <option value="Hosea">Hosea</option>
                        <option value="Joel">Joel</option>
                        <option value="Amos">Amos</option>
                        <option value="Obadiah">Obadiah</option>
                        <option value="Jonah">Jonah</option>
                        <option value="Micah">Micah</option>
                        <option value="Nahum">Nahum</option>
                        <option value="Habakkuk">Habakkuk</option>
                        <option value="Zephaniah">Zephaniah</option>
                        <option value="Haggai">Haggai</option>
                        <option value="Zechariah">Zechariah</option>
                        <option value="Malachi">Malachi</option>
                    </optgroup>
                    <!-- New Testament -->
                    <optgroup label="New Testament">
                        <option value="Matthew" selected>Matthew</option>
                        <option value="Mark">Mark</option>
                        <option value="Luke">Luke</option>
                        <option value="John">John</option>
                        <option value="Acts">Acts</option>
                        <option value="Romans">Romans</option>
                        <option value="1 Corinthians">1 Corinthians</option>
                        <option value="2 Corinthians">2 Corinthians</option>
                        <option value="Galatians">Galatians</option>
                        <option value="Ephesians">Ephesians</option>
                        <option value="Philippians">Philippians</option>
                        <option value="Colossians">Colossians</option>
                        <option value="1 Thessalonians">1 Thessalonians</option>
                        <option value="2 Thessalonians">2 Thessalonians</option>
                        <option value="1 Timothy">1 Timothy</option>
                        <option value="2 Timothy">2 Timothy</option>
                        <option value="Titus">Titus</option>
                        <option value="Philemon">Philemon</option>
                        <option value="Hebrews">Hebrews</option>
                        <option value="James">James</option>
                        <option value="1 Peter">1 Peter</option>
                        <option value="2 Peter">2 Peter</option>
                        <option value="1 John">1 John</option>
                        <option value="2 John">2 John</option>
                        <option value="3 John">3 John</option>
                        <option value="Jude">Jude</option>
                        <option value="Revelation">Revelation</option>
                    </optgroup>
                </select>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="chapter-input">Chapter</label>
                    <input type="number" id="chapter-input" value="6" min="1" max="150">
                </div>
                <div class="form-group">
                    <label for="verses-input">Verse(s) (e.g., 33 or 33-34)</label>
                    <input type="text" id="verses-input" value="33">
                </div>
            </div>
        </div>

        <!-- Manual Paste Section (Hidden by default) -->
        <div id="paste-inputs" class="hidden">
            <div class="form-group">
                <label for="custom-verse-title">Reference Title (e.g., Ephesians 6:1)</label>
                <input type="text" id="custom-verse-title" placeholder="Ephesians 6:1">
            </div>
            <div class="form-group">
                <label for="custom-verse-text">Paste Verse Text Here</label>
                <textarea id="custom-verse-text" placeholder="Paste your text here (superscripts and numbers will be automatically stripped)..."></textarea>
            </div>
        </div>

        <div class="form-group">
            <label for="difficulty-select">Difficulty Level</label>
            <select id="difficulty-select">
                <option value="easy">Easy (Only a couple of words missing)</option>
                <option value="medium">Medium (~25% words missing)</option>
                <option value="intermediate">Intermediate (~35% words missing)</option>
                <option value="middle-intermediate">Middle Intermediate (~50% words missing)</option>
                <option value="hard" selected>Hard (Every other word blank)</option>
            </select>
        </div>

        <button id="start-btn">Start Quiz</button>
    </div>

    <!-- Quiz Active Section -->
    <div id="quiz-section" class="hidden">
        <h3 id="quiz-title"></h3>
        <div id="quiz-container"></div>
        <button id="submit-btn">Submit Quiz</button>
    </div>

    <!-- Results Section -->
    <div id="results-section" class="hidden">
        <h3>Quiz Results</h3>
        <div id="results-container"></div>
        <button id="restart-btn">Quiz Again</button>
    </div>
</div>

<script>
    const ESV_API_KEY = 'YOUR_ESV_API_KEY_HERE';

    const pasteToggle = document.getElementById('paste-toggle');
    const apiInputs = document.getElementById('api-inputs');
    const pasteInputs = document.getElementById('paste-inputs');

    pasteToggle.addEventListener('change', () => {
        if (pasteToggle.checked) {
            apiInputs.classList.add('hidden');
            pasteInputs.classList.remove('hidden');
        } else {
            apiInputs.classList.remove('hidden');
            pasteInputs.classList.add('hidden');
        }
    });

    document.getElementById('start-btn').addEventListener('click', async () => {
        const difficulty = document.getElementById('difficulty-select').value;
        const isManualPaste = pasteToggle.checked;

        if (isManualPaste) {
            const title = document.getElementById('custom-verse-title').value.trim() || "Custom Verse";
            let text = document.getElementById('custom-verse-text').value.trim();

            if (!text) {
                alert("Please paste some verse text first!");
                return;
            }

            // 1. Remove verse numbers at the beginning of lines
            text = text.replace(/^\d+\s*/gm, '');
            
            // 2. Remove standalone tiny reference letters (like space+letter+space or start+letter+space)
            text = text.replace(/(^|\s)[a-zA-Z](\s|$)/g, ' ');

            document.getElementById('quiz-title').innerText = `Quiz: ${title}`;
            buildQuiz(text, difficulty);
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');

        } else {
            if (ESV_API_KEY === 'YOUR_ESV_API_KEY_HERE') {
                alert("Please paste your ESV API key into the script code, or check the box to paste verses manually!");
                return;
            }

            const book = document.getElementById('book-select').value;
            const chapter = document.getElementById('chapter-input').value;
            const verses = document.getElementById('verses-input').value.trim();

            const query = `${book} ${chapter}:${verses}`;
            document.getElementById('quiz-title').innerText = `Quiz: ${query} (ESV)`;

            const url = `https://api.esv.org/v3/passage/text/?q=${encodeURIComponent(query)}&include-headings=false&include-footnotes=false&include-verse-numbers=false&include-passage-references=false`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${ESV_API_KEY}`
                    }
                });
                const data = await response.json();

                if (!data.passages || data.passages.length === 0) {
                    alert("Could not fetch verse. Please check your book, chapter, and verse range.");
                    return;
                }

                const verseText = data.passages[0].trim();
                buildQuiz(verseText, difficulty);

                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('quiz-section').classList.remove('hidden');
            } catch (error) {
                alert("Error connecting to the ESV API. Check your internet connection or API key.");
            }
        }
    });

    function buildQuiz(text, difficulty) {
        const quizContainer = document.getElementById('quiz-container');
        quizContainer.innerHTML = '';

        const rawWords = text.split(/\s+/).filter(w => w.length > 0);

        rawWords.forEach((rawWord, index) => {
            const cleanWord = rawWord.replace(/^[.,\/#!$%\^&\*;:{}=\-_`~()]+|[.,\/#!$%\^&\*;:{}=\-_`~()]+$/g,"");
            let isBlank = false;

            if (cleanWord.length > 0) {
                if (difficulty === 'easy') {
                    if (index === 2 || index === 5) isBlank = true;
                } else if (difficulty === 'medium') {
                    if (index % 4 === 0 && cleanWord.length > 2) isBlank = true;
                } else if (difficulty === 'intermediate') {
                    if (index % 3 === 0 && cleanWord.length > 2) isBlank = true;
                } else if (difficulty === 'middle-intermediate') {
                    if (index % 2 === 0 && Math.random() > 0.3) isBlank = true;
                } else if (difficulty === 'hard') {
                    if (index % 2 !== 0) isBlank = true;
                }
            }

            if (isBlank && cleanWord.length > 0) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input';
                input.dataset.answer = cleanWord;
                quizContainer.appendChild(input);
            } else {
                const span = document.createElement('span');
                span.innerText = rawWord + ' ';
                quizContainer.appendChild(span);
            }
        });
    }

    document.getElementById('submit-btn').addEventListener('click', () => {
        const quizContainer = document.getElementById('quiz-container');
        const inputs = quizContainer.querySelectorAll('.blank-input');
        
        let correctCount = 0;
        let totalBlanks = inputs.length;

        inputs.forEach(input => {
            // Case-insensitive comparison (.toLowerCase())
            const userAnswer = input.value.trim().toLowerCase();
            const correctAnswer = input.dataset.answer.toLowerCase();
            const parent = input.parentNode;

            const span = document.createElement('span');
            if (userAnswer === correctAnswer) {
                span.className = 'correct';
                span.innerText = input.dataset.answer;
                correctCount++;
            } else {
                span.innerHTML = `<span class="incorrect">${input.value || '(blank)'}</span> <span class="correct">(${input.dataset.answer})</span>`;
            }
            parent.replaceChild(span, input);
        });

        document.getElementById('submit-btn').classList.add('hidden');
        
        const resultsContainer = document.getElementById('results-container');
        resultsContainer.innerHTML = `<div class="result-box">You got ${correctCount} out of ${totalBlanks} blanks correct!</div>`;
        document.getElementById('results-section').classList.remove('hidden');
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('results-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('setup-section').classList.remove('hidden');
    });
</script>

</body>
</html>
