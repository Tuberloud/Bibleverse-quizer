<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Verse Memorization Quiz</title>
    <style>
        :root {
            --primary-color: #9A7B4C;
            --primary-hover: #7D623C;
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-color: #2C2622;
            --border-color: #D6C7B2;
            --input-bg: #FFFFFF;
            --hint-bg: #F4EEDF;
        }

        [data-theme="dark"] {
            --primary-color: #C5A059;
            --primary-hover: #D8B56E;
            --bg-color: #1A1816;
            --card-bg: #24211E;
            --text-color: #EDE8E1;
            --border-color: #4A423B;
            --input-bg: #2E2A26;
            --hint-bg: #352F29;
        }

        body {
            font-family: 'Crimson Pro', Garamond, 'Times New Roman', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px -10px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Theme Toggle Switch */
        .theme-switch-container {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .theme-toggle {
            width: 50px;
            height: 26px;
            background-color: #333;
            border-radius: 50px;
            position: relative;
            transition: background-color 0.3s;
            border: 1px solid var(--border-color);
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            top: 2px;
            left: 3px;
            background-color: #FFFFFF;
            transition: transform 0.3s;
        }

        [data-theme="dark"] .theme-toggle {
            background-color: #E2D9CC;
        }

        [data-theme="dark"] .theme-toggle::before {
            transform: translateX(23px);
            background-color: #1A1816;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 2rem;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        select, input, textarea, button {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.05rem;
            box-sizing: border-box;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(154, 123, 76, 0.2);
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.05rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            margin-top: 8px;
        }

        .secondary-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        #quiz-container {
            margin: 24px 0;
            line-height: 2.5;
            font-size: 1.2rem;
            color: #000000 !important; /* Keep bible verses strictly black text */
        }

        [data-theme="dark"] #quiz-container {
            color: #EDE8E1 !important; /* Keep readable in dark mode if needed, or enforce strict black per user request */
        }

        .blank-input {
            display: inline-block;
            width: 110px;
            padding: 4px 8px;
            margin: 0 4px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .hidden {
            display: none !important;
        }

        .result-box {
            margin: 20px 0;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1.15rem;
            background-color: var(--hint-bg);
            border: 1px solid var(--border-color);
        }

        .correct {
            color: #16a34a;
            background-color: #dcfce7;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .incorrect {
            color: #dc2626;
            background-color: #fee2e2;
            text-decoration: line-through;
            padding: 3px 6px;
            border-radius: 4px;
            margin-right: 6px;
        }

        #quiz-section h3, #results-section h3 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.35rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        @media print {
            body {
                background: white;
                color: black;
            }
            .container {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            .theme-switch-container, button, select, label[for="difficulty-select"], #setup-section {
                display: none !important;
            }
            .blank-input {
                border-bottom: 1px solid black;
                border-top: none; border-left: none; border-right: none;
                border-radius: 0;
                width: 80px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Theme Toggle Switch -->
    <div class="theme-switch-container" id="theme-switch-btn" title="Toggle Light/Dark Theme">
        <div class="theme-toggle"></div>
    </div>

    <h1>Bible Verse Memorization Quiz</h1>

    <!-- Setup Form -->
    <div id="setup-section">
        <div class="form-group">
            <label for="custom-verse-title">Reference Title (e.g., Ephesians 6:1)</label>
            <input type="text" id="custom-verse-title" placeholder="Ephesians 6:1">
        </div>
        <div class="form-group">
            <label for="custom-verse-text">Paste Verse Text Here</label>
            <textarea id="custom-verse-text" placeholder="Paste your text here..."></textarea>
        </div>

        <div class="form-group">
            <label for="difficulty-select">Difficulty Level</label>
            <select id="difficulty-select">
                <option value="" disabled selected>-- Choose difficulty --</option>
                <option value="easy">Easy (Only a couple of words missing)</option>
                <option value="medium">Medium (~25% words missing)</option>
                <option value="intermediate">Intermediate (~35% words missing)</option>
                <option value="middle-intermediate">Middle Intermediate (~50% words missing)</option>
                <option value="hard">Hard (Every other word blank)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hints-select">Available Hints</label>
            <select id="hints-select">
                <option value="0" selected>0 hints</option>
                <option value="1">1 hint</option>
                <option value="2">2 hints</option>
                <option value="3">3 hints</option>
                <option value="5">5 hints</option>
                <option value="10">10 hints</option>
                <option value="15">15 hints</option>
                <option value="20">20 hints</option>
            </select>
        </div>

        <button id="start-btn">Start Quiz</button>
    </div>

    <!-- Quiz Active Section -->
    <div id="quiz-section" class="hidden">
        <h3 id="quiz-title"></h3>
        <div id="quiz-container"></div>
        
        <div id="hint-container" class="form-group hidden">
            <button type="button" id="hint-btn" class="secondary-btn">Get Hint (<span id="hints-remaining">0</span> left)</button>
        </div>

        <div class="action-row">
            <button id="submit-btn">Submit Quiz</button>
            <button id="print-btn" class="secondary-btn" onclick="window.print()">Print Quiz</button>
        </div>
    </div>

    <!-- Results Section -->
    <div id="results-section" class="hidden">
        <h3>Quiz Results</h3>
        <div id="results-container"></div>
        <div class="action-row">
            <button id="restart-btn">Quiz Again</button>
            <button id="result-print-btn" class="secondary-btn" onclick="window.print()">Print Results</button>
        </div>
    </div>
</div>

<script>
    // Theme Switcher Logic
    const themeSwitchBtn = document.getElementById('theme-switch-btn');
    themeSwitchBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
    });

    let availableHints = 0;

    document.getElementById('start-btn').addEventListener('click', () => {
        const difficulty = document.getElementById('difficulty-select').value;
        if (!difficulty) {
            alert("Please choose a difficulty level first!");
            return;
        }

        const title = document.getElementById('custom-verse-title').value.trim() || "Custom Verse";
        let text = document.getElementById('custom-verse-text').value.trim();

        if (!text) {
            alert("Please paste some verse text first!");
            return;
        }

        availableHints = parseInt(document.getElementById('hints-select').value);
        if (availableHints > 0) {
            document.getElementById('hint-container').classList.remove('hidden');
            document.getElementById('hints-remaining').innerText = availableHints;
        } else {
            document.getElementById('hint-container').classList.add('hidden');
        }

        text = text.replace(/^\d+\s*/gm, '');
        text = text.replace(/(^|\s)[a-zA-Z](\s|$)/g, ' ');

        document.getElementById('quiz-title').innerText = `Quiz: ${title}`;
        buildQuiz(text, difficulty);
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
    });

    function buildQuiz(text, difficulty) {
        const quizContainer = document.getElementById('quiz-container');
        quizContainer.innerHTML = '';

        const rawWords = text.split(/\s+/).filter(w => w.length > 0);
        
        let validIndices = [];
        rawWords.forEach((word, index) => {
            const clean = word.replace(/^[.,\/#!$%\^&\*;:{}=\-_`~()]+|[.,\/#!$%\^&\*;:{}=\-_`~()]+$/g,"");
            if (clean.length > 0) {
                validIndices.push(index);
            }
        });

        let chosenIndices = new Set();

        if (difficulty === 'hard') {
            let startOffset = Math.random() < 0.5 ? 0 : 1;
            validIndices.forEach((pos, idx) => {
                if (idx % 2 === startOffset) {
                    chosenIndices.add(pos);
                }
            });
        } else {
            let blankCount = 2; // Easy
            if (difficulty === 'medium') {
                blankCount = Math.max(2, Math.ceil(validIndices.length * 0.25));
            } else if (difficulty === 'intermediate') {
                blankCount = Math.max(3, Math.ceil(validIndices.length * 0.35));
            } else if (difficulty === 'middle-intermediate') {
                blankCount = Math.max(4, Math.ceil(validIndices.length * 0.50));
            }

            let shuffled = [...validIndices];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            let selected = shuffled.slice(0, blankCount);
            chosenIndices = new Set(selected);
        }

        rawWords.forEach((rawWord, index) => {
            const cleanWord = rawWord.replace(/^[.,\/#!$%\^&\*;:{}=\-_`~()]+|[.,\/#!$%\^&\*;:{}=\-_`~()]+$/g,"");
            
            if (chosenIndices.has(index) && cleanWord.length > 0) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input';
                input.dataset.answer = cleanWord;
                quizContainer.appendChild(input);
            } else {
                const span = document.createElement('span');
                span.innerText = rawWord + ' ';
                quizContainer.appendChild(span);
            }
        });
    }

    // Hint feature: reveal one letter at a time in an empty or partially filled blank input
    document.getElementById('hint-btn').addEventListener('click', () => {
        if (availableHints <= 0) return;

        const quizContainer = document.getElementById('quiz-container');
        const inputs = Array.from(quizContainer.querySelectorAll('.blank-input'));
        
        // Find an input that isn't fully filled yet
        let targetInput = inputs.find(inp => {
            const currentVal = inp.value.trim();
            const correctVal = inp.dataset.answer;
            return currentVal.length < correctVal.length;
        });

        if (targetInput) {
            const correctVal = targetInput.dataset.answer;
            const currentLen = targetInput.value.length;
            targetInput.value = correctVal.substring(0, currentLen + 1);
            
            availableHints--;
            document.getElementById('hints-remaining').innerText = availableHints;
            if (availableHints <= 0) {
                document.getElementById('hint-container').classList.add('hidden');
            }
        } else {
            alert("All blanks are already filled!");
        }
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
        const quizContainer = document.getElementById('quiz-container');
        const inputs = quizContainer.querySelectorAll('.blank-input');
        
        let correctCount = 0;
        let totalBlanks = inputs.length;

        inputs.forEach(input => {
            const userAnswer = input.value.trim().toLowerCase();
            const correctAnswer = input.dataset.answer.toLowerCase();
            const parent = input.parentNode;

            const span = document.createElement('span');
            if (userAnswer === correctAnswer) {
                span.className = 'correct';
                span.innerText = input.dataset.answer;
                correctCount++;
            } else {
                span.innerHTML = `<span class="incorrect">${input.value || '(blank)'}</span> <span class="correct">(${input.dataset.answer})</span>`;
            }
            parent.replaceChild(span, input);
        });

        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('hint-container').classList.add('hidden');
        
        const resultsContainer = document.getElementById('results-container');
        resultsContainer.innerHTML = `<div class="result-box">You got ${correctCount} out of ${totalBlanks} blanks correct!</div>`;
        document.getElementById('results-section').classList.remove('hidden');
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('results-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('setup-section').classList.remove('hidden');
        document.getElementById('difficulty-select').value = "";
    });
</script>

</body>
</html>
